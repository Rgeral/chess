name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" > wg0.conf
          sudo wg-quick up ./wg0.conf

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v1
        with:
          host: 192.168.1.118
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/Cargo.toml,backend/Cargo.lock,backend/dockerfile,backend/migrations/**,backend/.sqlx/**,backend/src/**,frontend/**,docker-compose.yml,docker-compose-stockfish.yml,README.md,scripts/**"
          target: "/home/rgeral/chess/chess"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: 192.168.1.118
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            cd /home/rgeral/chess/chess

            # Ensure VM .env exists. Postgres credentials come from GitHub secrets
            # (POSTGRES_PASSWORD) only on first creation; afterwards the VM's .env is kept.
            if [ ! -f .env ]; then
              umask 077
              printf '%s\n' \
                'POSTGRES_USER=chess' \
                "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
                'POSTGRES_DB=chess' \
                'CORS_ORIGIN=https://chess.rdevs.fr' \
                'RUST_LOG=info' \
                'RUST_BACKTRACE=1' > .env
            fi
            grep -q '^POSTGRES_PASSWORD=.\+' .env || { echo 'POSTGRES_PASSWORD missing in .env' >&2; exit 1; }

            # Validate compose
            docker-compose -f docker-compose.yml config >/dev/null

            # Stop old stack (ignore errors)
            docker-compose down --remove-orphans || true

            # Build images fresh
            DOCKER_BUILDKIT=1 docker-compose build

            # Start Postgres and wait until healthy
            docker-compose up -d postgres
            for i in $(seq 1 30); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$(docker-compose ps -q postgres)" 2>/dev/null || echo '')
              [ "$st" = healthy ] && break
              echo "Waiting for postgres ($i) (status=$st)"
              sleep 2
            done
            [ "$st" = healthy ] || { docker-compose logs --tail=100 postgres >&2; exit 1; }

            # Run migrations using the new backend image against Postgres
            echo "== Running migrations =="
            if ! docker-compose run --rm backend sh -c 'sqlx migrate run'; then
              echo "Migrations failed." >&2
              docker-compose logs --tail=100 postgres >&2 || true
              exit 1
            fi

            # Start backend only to avoid depends_on failing the whole up
            docker-compose up -d --remove-orphans backend || true

            # Wait for backend health
            for i in $(seq 1 60); do
              cid=$(docker-compose ps -q backend || true)
              [ -n "$cid" ] || { echo 'backend container not found'; sleep 2; continue; }
              st=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo '')
              [ "$st" = healthy ] && { echo 'Backend healthy'; break; }
              echo "Waiting for backend health ($i) (status=$st)"
              docker inspect "$cid" -f '{{range .State.Health.Log}}{{.End}} | code={{.ExitCode}} | {{.Output}}{{"\n"}}{{end}}' | tail -n 5 || true
              sleep 2;
            done

            st=$(docker inspect -f '{{.State.Health.Status}}' $(docker-compose ps -q backend) 2>/dev/null || echo '')
            if [ "$st" != healthy ]; then
              echo 'Backend not healthy — logs:' >&2
              docker-compose logs --tail=200 backend || true
              echo 'State:' >&2
              docker inspect $(docker-compose ps -q backend) -f '{{json .State}}' || true
              echo 'Volume logs:' >&2
              docker-compose logs --tail=100 postgres || true
              exit 1
            fi

            # Start frontend now that backend is healthy
            docker-compose up -d --remove-orphans frontend

            # Wait for nginx (frontend) readiness before smoke tests
            echo 'Waiting for frontend (nginx) to be ready on :80'
            ready=0
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null http://127.0.0.1/_app/version.json; then
                echo 'Frontend ready'
                ready=1
                break
              fi
              echo "Waiting for nginx ($i)"
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo 'Frontend not ready — logs:' >&2
              docker-compose logs --tail=200 frontend || true
              echo 'State:' >&2
              docker inspect $(docker-compose ps -q frontend) -f '{{json .State}}' || true
              exit 1
            fi

            # Smoke tests through nginx
            curl -fsS -D - -o /dev/null http://127.0.0.1/_app/version.json | head -n1
            curl -fsS -D - -o /dev/null -X POST \
              -H 'Content-Type: application/json' \
              --data '{"query":"{__typename}"}' \
              http://127.0.0.1/graphql | head -n1